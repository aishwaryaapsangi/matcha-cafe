<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>E-Matcha Cafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <div id="cafe-container">
      <div class="cafe-window">

      <img src="cat-matcha.gif" class="cat-matcha" id="cafe-cat" />
      <img src="start-order.png" alt="Start Order" class="btn start-btn"/>
      </div>
    </div>

    <div id="letter-container">
      <div class="letter-window">
        <div class="matcha-buttons" id="matcha-buttons">
          <button class="drink-card" id="matcha-latte">
            <img src="matcha-latte.png" alt="Matcha Latte">
          </button>

          <button class="drink-card" id="strawberry-matcha">
              <img src="straw-matcha.png" alt="Strawberry Matcha">
          </button>

          <button class="drink-card" id="matcha-boba">
              <img src="matcha-boba.png" alt="Matcha Boba">
          </button>

          <button class="drink-card" id="sakura-matcha">
              <img src="sakura-matcha.png" alt="Sakura Matcha">
          </button>
        </div>
      </div>
    </div>


    <div id="recipt-container">
      <div class="recipt-window">
        <h1 id="letter-title">Do you like it?</h1>

        <img src="matcha-sip.gif" class="gif-sip" id="matcha-sip" style="display: none"  />
        <img src="sakura-sip.gif" class="gif-sip" id="sakura-sip" style="display: none" />
        <img src="straw-sip.gif" class="gif-sip" id="straw-sip" style="display: none" />
        <img src="boba-sip.gif" class="gif-sip" id="boba-sip" style="display: none" />

       <img src="cat_dance.gif" class="cat" id="letter-cat"  style="display: none"  />

        <div class="final-buttons" id="final-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div> 

      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
